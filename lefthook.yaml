# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json

pre-commit:
    jobs:
        - name: format
          glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,yaml,yml,css,html,md,mdx}"
          run: bun x --no-install vp fmt {staged_files}
          stage_fixed: true
        - name: lint
          glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
          run: bun x --no-install vp lint --fix --no-error-on-unmatched-pattern {staged_files}
          stage_fixed: true
