name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun run test
